[tools]
node = "26"

[tasks.render]
description = "Render resume.json to resume.html with the local theme"
sources = ["resume.json", "theme/index.js", "theme/package.json"]
outputs = ["resume.html"]
run = '''
node -e 'const fs = require("fs"); const { render } = require("./theme"); fs.writeFileSync("resume.html", render(JSON.parse(fs.readFileSync("resume.json", "utf8"))));'
'''

[tasks.pdf]
description = "Export resume.pdf from the rendered HTML (light palette, A4)"
depends = ["render"]
sources = ["resume.html"]
outputs = ["resume.pdf"]
run = '''
"${CHROME:-google-chrome-stable}" --headless --disable-gpu --no-pdf-header-footer --virtual-time-budget=10000 --print-to-pdf=resume.pdf resume.html
'''

[tasks.serve]
description = "Serve the rendered resume on http://localhost:8080"
depends = ["render"]
run = "npx -y http-server -p 8080 -c-1 ."

[tasks.validate]
description = "Validate resume.json against the JSON Resume schema"
run = "npx -y resumed validate resume.json"

[tasks.clean]
description = "Remove generated files"
run = "rm -f resume.html resume.pdf"
